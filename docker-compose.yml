services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - iot-network

  spark:
    build:
      context: .
      dockerfile: Dockerfile.spark
    image: spark-kafka:3.5.1
    container_name: spark
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SPARK_MASTER: local[*]
      PYSPARK_PYTHON: python3
    volumes:
      # Use named volume to avoid Windows NativeIO issues
      - spark-checkpoint:/tmp/spark-checkpoint
      # Mount app directory (use bind mount only for code, not for Spark work dirs)
      - ./spark:/app
    working_dir: /app
    entrypoint: ["/usr/local/bin/spark-entrypoint.sh"]
    command: >
      /opt/spark/bin/spark-submit
      --master local[*]
      --conf spark.sql.streaming.checkpointLocation=/tmp/spark-checkpoint
      --conf spark.eventLog.enabled=false
      --conf spark.sql.adaptive.enabled=true
      --conf spark.serializer=org.apache.spark.serializer.KryoSerializer
      /app/spark_stream.py
    networks:
      - iot-network

  producer:
    image: python:3.9-slim
    container_name: producer
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./kafka-foundation/producer:/app
    working_dir: /app
    command: >
      bash -c "pip install -q kafka-python && python sensor_producer.py"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - iot-network

networks:
  iot-network:
    driver: bridge

volumes:
  spark-checkpoint:
    driver: local

  postgres_data:
    driver: local
    
  grafana_data:
    driver: local


